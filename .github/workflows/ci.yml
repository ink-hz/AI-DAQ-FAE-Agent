name: DAQ FAE CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out DAQ FAE
        uses: actions/checkout@v4

      - name: Check out pinned FAE runtime
        uses: actions/checkout@v4
        with:
          repository: ink-hz/AI-FAE-Agent
          ref: bf1ce9af2d467447e39e2be0caae0bb87b1ba689
          token: ${{ secrets.FAE_UPSTREAM_READ_TOKEN }}
          path: upstream
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify upstream source snapshot
        run: python scripts/verify_upstream_snapshot.py --upstream upstream

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q tests

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out DAQ FAE
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: webui

      - name: Test WebUI
        run: npm test
        working-directory: webui

      - name: Build WebUI
        run: npm run build
        working-directory: webui
