services:
  ai-daq-fae-backend:
    image: sha256:5ed10ead83ee10ad5ef668fad8ee6aa7d28e37bb8d217fd22daa84d6d5db5bf7
    pull_policy: never
    container_name: ai-daq-fae-backend
    restart: unless-stopped
    user: "21081:21081"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /tmp
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=21081,gid=21081,mode=0700
    env_file:
      - ${DAQ_ENV_FILE:?DAQ_ENV_FILE is required}
    volumes:
      - type: bind
        source: ${DAQ_PREPARED_MAIN_ROOT:?DAQ_PREPARED_MAIN_ROOT is required}
        target: /app/data/knowledge/reviewed-thinking-prefix-20261028
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DAQ_PREPARED_SDK_ROOT:?DAQ_PREPARED_SDK_ROOT is required}
        target: /app/data/knowledge/sdk-thinking-prefix-20261028
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DAQ_PREPARED_SECRETS:?DAQ_PREPARED_SECRETS is required}
        target: /run/daq-secrets
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DAQ_PREPARED_ATTACHMENTS:?DAQ_PREPARED_ATTACHMENTS is required}
        target: /app/data/attachments
        bind: {create_host_path: false}
      - type: bind
        source: ${DAQ_PREPARED_TRACE:?DAQ_PREPARED_TRACE is required}
        target: /app/data/daq_traces.jsonl
        bind: {create_host_path: false}
    ports:
      - 127.0.0.1:8081:8081
    networks:
      camera-db:
      platform-edge:
        ipv4_address: 172.31.0.9
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 12

networks:
  camera-db:
    external: true
    name: deploy_default
  platform-edge:
    external: true
    name: orbbec-agent-platform-edge
